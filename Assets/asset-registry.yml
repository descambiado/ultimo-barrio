schema_version: 1

assets:
  - id: facepunch/sboxweapons
    name: s&box Weapons
    author: Facepunch
    source_url: https://sbox.game/facepunch/sboxweapons
    package_type: collection
    license: pending-package-verification
    license_verified: false
    integration_mode: reference
    version_or_checked_at: "2026-08-02"
    used_by:
      - planned:weapon-viewmodels
      - planned:weapon-worldmodels
      - planned:attachments
    fallback: project-owned placeholder models
    notes: >
      Official collection. Use alongside official weapon components.
      Verify terms and source availability inside the editor before release.

  - id: omniparadigm/weapons
    name: Weapons
    author: OmniParadigm
    source_url: https://sbox.game/omniparadigm/weapons
    package_type: unknown
    license: unknown
    license_verified: false
    integration_mode: temporary-prototype
    version_or_checked_at: "2026-08-02"
    used_by:
      - spike:SPIKE-WEAPONS-001
    fallback: official BaseCombatWeapon path
    notes: >
      Do not make this a release dependency until source, license,
      networking authority, dependencies and maintenance are verified.

  # ------------------------------------------------------------------
  # Content pack portable — spike/laptop-content-stack (2026-08-07)
  # Todos los candidatos están PENDING_VERIFY: revisar licencia y ruta
  # exacta con Cloud Browser antes de cualquier build pública.
  # Los prefabs usan hoy solo fallbacks verificados del contenido oficial.
  # ------------------------------------------------------------------

  - id: facepunch.w_usp
    name: USP world model
    author: Facepunch
    source_url: https://sbox.game/facepunch/sboxweapons
    package_type: package-asset
    asset_type: model
    cloud_ident: facepunch.w_usp
    license: pending-package-verification
    license_verified: false
    integration_mode: content-pack-verified
    resolution: Cloud.Model(cloud_ident) -- API oficial; persistente tras reinicio del editor, sin install manual
    version_or_checked_at: "2026-08-07"
    editor_verified: true
    verification_status: VERIFIED (resuelto via Cloud.Model en weapon_lab)
    asset_path: models/weapons/sbox_pistol_usp/w_usp.vmdl
    used_by:
      - content:Weapons/ub_weapon_usp
    fallback: models/sbox_props/metal_wheely_bin/metal_wheely_bin.vmdl
    notes: >
      Resuelto por Cloud.Model() en WeaponContentHost.ResolveModel (orden: cloud ident →
      ruta local → fallback). La ruta local solo existe como fallback si el paquete está
      montado; el camino principal no depende de ello. Colección oficial Facepunch.

  - id: facepunch.v_usp
    name: USP viewmodel + animgraph
    author: Facepunch
    source_url: https://sbox.game/facepunch/sboxweapons
    package_type: package-asset
    asset_type: model
    cloud_ident: facepunch.v_usp
    license: pending-package-verification
    license_verified: false
    integration_mode: content-pack-verified
    resolution: Cloud.Model(cloud_ident) -- API oficial; aplicado por WeaponTestRig (Dev) al viewmodel
    version_or_checked_at: "2026-08-07"
    editor_verified: true
    verification_status: VERIFIED (resuelto via Cloud.Model en weapon_lab)
    asset_path: models/weapons/sbox_pistol_usp/v_usp.vmdl
    animgraph_path: models/weapons/sbox_pistol_usp/v_usp.vanmgrph
    used_by:
      - content:Weapons/ub_weapon_usp (viewmodel)
    fallback: models/dev/box.vmdl
    notes: >
      ViewModel con rig y animaciones; trae su propio Animation Graph (v_usp.vanmgrph).
      El prefab del pack mantiene su ruta como fallback; el camino principal resuelve
      por ident cloud.

  - id: facepunch.uspmagazine
    name: USP magazine (+empty)
    author: Facepunch
    source_url: https://sbox.game/facepunch/sboxweapons
    package_type: package-asset
    license: pending-package-verification
    license_verified: false
    integration_mode: content-pack-verified
    version_or_checked_at: "2026-08-07"
    editor_verified: true
    asset_path: models/weapons/sbox_pistol_usp/usp_magazine.vmdl
    used_by:
      - content:Weapons/ub_weapon_usp (magazine)
    fallback: none
    notes: >
      Variante vacía: models/weapons/sbox_pistol_usp/usp_magazine_empty.vmdl.

  - id: facepunch.ammobox9mm
    name: 9mm ammo box
    author: Facepunch
    source_url: https://sbox.game/facepunch/sboxweapons
    package_type: package-asset
    license: pending-package-verification
    license_verified: false
    integration_mode: content-pack-verified
    version_or_checked_at: "2026-08-07"
    editor_verified: true
    asset_path: models/weapons/sbox_ammo/9mm_ammobox/ammobox_9mm.vmdl
    used_by:
      - content:Weapons/ub_weapon_usp (ammo model)
    fallback: models/sbox_props/cardboard_box/cardboard_box_open.vmdl
    notes: >
      Sustituye al candidato facepunch.ammo_9mm (no existía como paquete instalable).

  - id: facepunch.casingscatter9mm01
    name: 9mm casings scatter
    author: Facepunch
    source_url: https://sbox.game/facepunch/sboxweapons
    package_type: package-asset
    license: pending-package-verification
    license_verified: false
    integration_mode: content-pack-verified
    version_or_checked_at: "2026-08-07"
    editor_verified: true
    asset_path: models/props/casings/casing_scatter_9mm_01.vmdl
    used_by:
      - content:Weapons/ub_weapon_usp (casing)
    fallback: none
    notes: >
      Casquillos 9mm para efectos de expulsión.

  - id: facepunch.w_crowbar
    name: Crowbar world model
    author: Facepunch (candidato)
    source_url: https://sbox.game/facepunch/sboxweapons
    package_type: package-asset
    license: pending-package-verification
    license_verified: false
    integration_mode: content-pack-candidate
    version_or_checked_at: "2026-08-07"
    used_by:
      - content:Weapons/ub_weapon_crowbar
    fallback: models/citizen_props/crate01.vmdl
    notes: >
      Confirmar existencia real del asset; si no existe, buscar modelo de palanca
      con licencia compatible (research del stack de contenido).

  - id: facepunch.knife
    name: Knife world model
    author: Facepunch (candidato)
