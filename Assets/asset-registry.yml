  - id: facepunch.ammo_9mm
    name: 9mm ammo model (SUPERSEDED by facepunch.ammobox9mm)
    author: Facepunch (candidato)
    source_url: https://sbox.game/facepunch/sboxweapons
    package_type: package-asset
    license: pending-package-verification
    license_verified: false
    integration_mode: superseded
    version_or_checked_at: "2026-08-07"
    used_by: []
    fallback: models/weapons/sbox_ammo/9mm_ammobox/ammobox_9mm.vmdl
    notes: >
      No existía como paquete instalable; reemplazado por facepunch.ammobox9mm (verificado).

  - id: facepunch.citizen-model
    name: Citizen base model (+animgraph embebido)
    author: Facepunch
    source_url: https://sbox.game/facepunch
    package_type: engine-content
    license: pending-package-verification
    license_verified: false
    integration_mode: content-pack-verified
    version_or_checked_at: "2026-08-07"
    editor_verified: true
    asset_path: models/citizen/citizen.vmdl
    used_by:
      - content:Enemies/ub_enemy_saqueador
      - content:Enemies/ub_enemy_bruto
      - content:Enemies/ub_enemy_merodeador
    fallback: models/citizen_props/crate01.vmdl
    notes: >
      citizen.vmdl verificado en el asset system (568 modelos citizen instalados).
      El animgraph va embebido en el modelo (no hay citizen.animgraph suelto en assets).
