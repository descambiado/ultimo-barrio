    package_type: package-asset
    license: pending-package-verification
    license_verified: false
    integration_mode: content-pack-candidate
    version_or_checked_at: "2026-08-07"
    used_by:
      - content:Weapons/ub_weapon_knife
    fallback: models/citizen_props/crate01.vmdl
    notes: >
      Confirmar existencia real del asset o buscar modelo de cuchillo legal.

  - id: facepunch.w_shotgun
    name: Shotgun world model
    author: Facepunch (candidato)
    source_url: https://sbox.game/facepunch/sboxweapons
