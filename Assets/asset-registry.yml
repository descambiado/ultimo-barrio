  - id: facepunch.w_usp
    name: USP world model
    author: Facepunch
    source_url: https://sbox.game/facepunch/sboxweapons
    package_type: package-asset
    asset_type: model
    cloud_ident: facepunch.w_usp
    license: pending-package-verification
    license_verified: false
    integration_mode: content-pack-verified
    resolution: Cloud.Model(cloud_ident) -- API oficial; persistente tras reinicio del editor, sin install manual
    version_or_checked_at: "2026-08-07"
    editor_verified: true
    verification_status: VERIFIED (resuelto via Cloud.Model en weapon_lab)
    asset_path: models/weapons/sbox_pistol_usp/w_usp.vmdl
    used_by:
      - content:Weapons/ub_weapon_usp
    fallback: models/sbox_props/metal_wheely_bin/metal_wheely_bin.vmdl
    notes: >
      Resuelto por Cloud.Model() en WeaponContentHost.ResolveModel (orden: cloud ident →
      ruta local → fallback). La ruta local solo existe como fallback si el paquete está
      montado; el camino principal no depende de ello. Colección oficial Facepunch.

